<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Course Project - Create New Account</title>
    <style>
        /* Genel Arka Plan ve Yazı Tipi */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        /* Form Konteynırı */
        .container {
            background-color: #fff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
        }

        h2 {
            margin-top: 0;
            color: #333;
            text-align: center;
        }

        p {
            text-align: center;
            color: #666;
            font-size: 14px;
            margin-bottom: 30px;
        }

        /* Input Alanları */
        label {
            font-weight: 600;
            color: #444;
            font-size: 13px;
            display: block;
            margin-bottom: 5px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            border: 1px solid #ddd;
            border-radius: 6px;
            box-sizing: border-box;
            transition: border-color 0.3s;
        }

        input:focus {
            border-color: #4A90E2;
            outline: none;
        }

        /* Buton */
        button {
            width: 100%;
            padding: 14px;
            background-color: #4A90E2;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: background-color 0.3s;
        }

        button:hover {
            background-color: #357ABD;
        }

        /* Mesajlar */
        .error { 
            color: #d9534f; 
            background-color: #f2dede;
            padding: 10px;
            border-radius: 4px;
            display: none; 
            font-size: 13px;
            text-align: center;
            margin-bottom: 15px;
        }

        .success { 
            color: #3c763d; 
            background-color: #dff0d8;
            padding: 10px;
            border-radius: 4px;
            display: none;
            text-align: center;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Create New Account</h2>
        <p>Please fill in the details below to register.</p>
        
        <form id="registerForm">
            <label>First Name (Min 2 chars):</label>
            <input type="text" id="firstName" required>
            
            <label>Last Name (Min 2 chars):</label>
            <input type="text" id="lastName" required>
            
            <label>E-mail (Must be valid format):</label>
            <input type="email" id="email" required>
            
            <label>Date of Birth (Age 18-65):</label>
            <input type="date" id="dob" required>
            
            <label>Password (Min 8 chars, 1 Uppercase, 1 Number):</label>
            <input type="password" id="password" required>
            
            <label>Confirm Password:</label>
            <input type="password" id="confirmPassword" required>
            
            <button type="submit" id="submitBtn">SUBMIT</button>
        </form>

        <div id="message" class="success">Registration Successful!</div>
        <div id="errorMsg" class="error">Invalid input. Please check the rules!</div>
    </div>
</body>
</html>
