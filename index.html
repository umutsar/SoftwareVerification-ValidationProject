<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Course Project - Create New Account</title>
    <style>
        .error { color: red; display: none; font-size: 12px; }
        .success { color: green; display: none; }
    </style>
</head>
<body>
    <h2>Create New Account</h2>
    <p>Please fill in the details below to register.</p>
    
    <form id="registerForm">
        <label>First Name (Min 2 chars):</label><br>
        <input type="text" id="firstName" required><br>
        
        <label>Last Name (Min 2 chars):</label><br>
        <input type="text" id="lastName" required><br>
        
        <label>E-mail (Must be valid format):</label><br>
        <input type="email" id="email" required><br>
        
        <label>Date of Birth (Age 18-65):</label><br>
        <input type="date" id="dob" required><br>
        
        <label>Password (Min 8 chars, 1 Uppercase, 1 Number):</label><br>
        <input type="password" id="password" required><br>
        
        <label>Confirm Password:</label><br>
        <input type="password" id="confirmPassword" required><br><br>
        
        <button type="submit" id="submitBtn">SUBMIT</button>
    </form>

    <div id="message" class="success">Registration Successful!</div>
    <div id="errorMsg" class="error">Invalid input. Please check the rules!</div>
</body>
</html>
