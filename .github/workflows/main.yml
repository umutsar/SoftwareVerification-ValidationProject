name: Test Otomasyonu
on: [push, pull_request] # Sen her kod attığında çalışır

jobs:
  test-et:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3 # Kodunu kopyalar
      - name: Java Kur
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Testleri Calistir
        run: mvn test # Yazdığın 15 testi koşturur